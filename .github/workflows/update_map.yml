name: PAGASA Auto-Tracker

# 1. THE ALARM CLOCK: Run every hour, and allow manual triggering
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

# 2. THE PERMISSIONS: Allow the bot to push code and publish the webpage
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-map:
    runs-on: ubuntu-latest
    steps:
      # Step A: Get the latest code from your repo
      - name: Checkout Repository
        uses: actions/checkout@v7

      # Step B: Install Python
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      # Step C: Install your dependencies (requests, folium, deepseek, etc.)
      - name: Install Requirements
        run: pip install -r requirements.txt

      # Step D: Run the master script! (Pass your DeepSeek API key securely)
      - name: Run Pipeline
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python -m src.main

      # Step E: Commit the new HTML map back to the repository
      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add data/output/storm_map.html data/output/storm_track.geojson
          # Only commit if there are actually changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "bot: auto-update storm map" && git push)
