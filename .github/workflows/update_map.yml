name: PAGASA Auto-Tracker

# Run manually only (workflow_dispatch). No cron: hourly runs burned
# DeepSeek API tokens for a map nobody was viewing.
on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write   # required by actions/deploy-pages
  pages: write      # required by actions/deploy-pages

# Only one update may run at a time. If a new run starts while another
# is still going, it waits instead of pushing a stale snapshot.
concurrency:
  group: pagasa-map-update
  cancel-in-progress: false

jobs:
  update-map:
    runs-on: ubuntu-latest
    steps:
      # Step A: Get the latest code from your repo
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          # Fetch full history so 'git pull --rebase' can replay the
          # bot commit onto the latest remote state.
          fetch-depth: 0

      # Step B: Install Python
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      # Step C: Install your dependencies (requests, folium, deepseek, etc.)
      - name: Install Requirements
        run: pip install -r requirements.txt

      # Step D: Run the master script! (Pass your DeepSeek API key securely)
      - name: Run Pipeline
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python -m src.main

      # Step E: Commit the new HTML map back to the repository
      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add data/output/storm_map.html data/output/storm_track.geojson
          # Only commit if there are actually changes
          git diff --quiet && git diff --staged --quiet || git commit -m "bot: auto-update storm map"
          # Integrate any commits pushed while this run was working,
          # then push. This prevents the 'fetch first' rejection.
          git pull --rebase origin main
          git push

      # Step F: Publish the map to GitHub Pages (site root is the map)
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage Map as Site Root
        run: |
          mkdir -p _site
          cp data/output/storm_map.html _site/index.html
          cp data/output/storm_track.geojson _site/storm_track.geojson
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to Pages
        uses: actions/deploy-pages@v4
